# Tells GitHub Actions which firmware files to build.
# Each entry below produces one .uf2 file in the build's downloadable zip.
---
include:
  # Left half (central: the half that talks to your computer).
  # The snippet + cmake-args enable ZMK Studio. Only the central half needs them.
  - board: nice_nano_v2
    shield: cirrus_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: cirrus_left_studio

  # Right half (peripheral: talks only to the left half).
  - board: nice_nano_v2
    shield: cirrus_right

  # Flash this to a half to wipe its saved Bluetooth pairings/settings
  # (and any ZMK Studio keymap edits), then flash the normal firmware again.
  - board: nice_nano_v2
    shield: settings_reset

  # Diagnostic firmware: makes each controller pin "type" its own name,
  # handy for finding a bad solder joint. Not for everyday use.
  - board: nice_nano_v2
    shield: tester_pro_micro
