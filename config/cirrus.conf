# Settings in this file apply to BOTH halves of the keyboard.
# It must live directly in config/ (ZMK does not read .conf files from boards/shields/cirrus/).

# Name shown when pairing over Bluetooth
CONFIG_ZMK_KEYBOARD_NAME="Cirrus"

# Let the keyboard go into deep sleep after inactivity (press a key to wake)
CONFIG_ZMK_SLEEP=y

# Stronger Bluetooth signal (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# More reliable Bluetooth reconnection behavior
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Allow the full set of media/consumer keys (needed for keys like C_AL_COFFEE)
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Mouse emulation, needed for the &msc scroll keys in the keymap
CONFIG_ZMK_POINTING=y

# Deep sleep after 1 hour of no typing (milliseconds). ZMK's default is 15 minutes.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
